name: Релиз npm-пакетов

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release-npm.yml"
      - "package-lock.json"
      - "package.json"
      - "packages/**"

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Предпочтительный путь: npm trusted publishing через GitHub OIDC.
# Каждый публичный пакет нужно настроить как trusted publisher на npm.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run ci

      - name: Создание релизного запроса на слияние или публикация изменившихся пакетов
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release:npm
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
