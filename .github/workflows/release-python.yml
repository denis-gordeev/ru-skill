name: Выпуск пакетов Python

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-please/**"
      - ".github/workflows/release-python.yml"
      - "python-packages/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  scaffold-only:
    if: ${{ hashFiles('python-packages/**/pyproject.toml') == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "пакет Python пока не существует. release-please остаётся в режиме заглушки."

  release:
    if: ${{ hashFiles('python-packages/**/pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please/python-config.json
          manifest-file: .github/release-please/python-manifest.json

      - name: Напоминание
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          echo "Метаданные выпуска пакета Python созданы."
          echo "Подключите шаги сборки/публикации для конкретного пакета, когда будет добавлен первый пакет Python."
